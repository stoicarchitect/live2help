<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Roles — Live 2 Help Recruitment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.png" type="image/png">
<style>
:root {
  --gold: #C9A84C;
  --gold-l: #E8C96A;
  --gold-dim: rgba(201,168,76,0.12);
  --dark: #0C0C0C;
  --card: #1A1A1A;
  --bdr: rgba(201,168,76,0.15);
  --bdr-h: rgba(201,168,76,0.4);
  --tx: #F2F0EA;
  --tx2: #A09E97;
  --tx3: #5C5A55;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,168,76,0.10), transparent 60%),
    var(--dark);
  color: var(--tx);
  min-height: 100vh;
  font-size: 14px;
}
h1, h2, .serif { font-family: 'Cormorant Garamond', Georgia, serif; }

header {
  padding: 48px 20px 30px;
  text-align: center;
  border-bottom: 1px solid var(--bdr);
  position: relative;
}
header::after {
  content: "";
  position: absolute;
  bottom: -1px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.brand-logo {
  height: 44px;
  width: auto;
  margin: 0 auto 22px;
  display: block;
  border-radius: 6px;
}
header h1 { font-size: 36px; font-weight: 700; color: var(--tx); letter-spacing: 0.01em; }
header p { color: var(--tx2); margin-top: 10px; font-size: 14px; letter-spacing: 0.02em; }

main {
  max-width: 760px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}

#status { color: var(--tx3); font-size: 13px; margin-bottom: 20px; text-align: center; }

.job-card {
  background: var(--card);
  border: 1px solid var(--bdr);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 14px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.25);
  transition: border-color 0.15s, transform 0.15s;
}
.job-card:hover { border-color: var(--bdr-h); transform: translateY(-1px); }
.job-title { font-size: 18px; font-weight: 600; color: var(--tx); margin-bottom: 6px; }
.job-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.job-tag {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--gold-l);
  background: var(--gold-dim);
  border: 1px solid var(--bdr);
  padding: 3px 9px;
  border-radius: 20px;
}
.job-apply {
  display: inline-block;
  font-size: 13px;
  color: var(--dark);
  background: var(--gold);
  padding: 8px 16px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: 500;
}
.job-apply:hover { background: var(--gold-l); }

.empty-state {
  text-align: center;
  color: var(--tx2);
  padding: 60px 20px;
  border: 1px dashed var(--bdr);
  border-radius: var(--radius);
}
.empty-state h2 { color: var(--tx); font-size: 22px; margin-bottom: 8px; }

footer {
  text-align: center;
  padding: 30px 20px;
  color: var(--tx3);
  font-size: 12px;
  border-top: 1px solid var(--bdr);
}
</style>
</head>
<body>

<header>
  <img class="brand-logo" src="assets/logo.png" alt="Live 2 Help Recruitment">
  <h1 class="serif">Live Roles</h1>
  <p>Current opportunities from Live 2 Help Recruitment</p>
</header>

<main>
  <div id="status">Loading current roles…</div>
  <div id="job-list"></div>
</main>

<footer>
  Live 2 Help Recruitment &middot; Anyone &middot; Anywhere &middot; Anytime
</footer>

<script>
async function loadJobs() {
  const status = document.getElementById('status');
  const list = document.getElementById('job-list');
  try {
    const res = await fetch('jobs.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('jobs.json not found');
    const data = await res.json();
    const jobs = data.jobs || [];

    if (jobs.length === 0) {
      status.style.display = 'none';
      list.innerHTML = `
        <div class="empty-state">
          <h2>No open roles right now</h2>
          <p>Check back soon, or get in touch directly — new opportunities go live regularly.</p>
        </div>`;
      return;
    }

    const updated = data.updated_at ? new Date(data.updated_at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : null;
    status.textContent = updated ? `${jobs.length} live role(s) · updated ${updated}` : `${jobs.length} live role(s)`;

    list.innerHTML = jobs.map(job => `
      <div class="job-card">
        <div class="job-title">${escapeHtml(job.title)}</div>
        <div class="job-meta">
          ${job.department ? `<span class="job-tag">${escapeHtml(job.department)}</span>` : ''}
          <span class="job-tag">${escapeHtml(job.location)}</span>
          ${job.remote ? `<span class="job-tag">Remote</span>` : ''}
          ${job.employment_type ? `<span class="job-tag">${escapeHtml(job.employment_type)}</span>` : ''}
        </div>
        ${job.url ? `<a class="job-apply" href="${escapeAttr(job.url)}" target="_blank" rel="noopener">View & Apply</a>` : ''}
      </div>
    `).join('');
  } catch (err) {
    status.textContent = 'Unable to load current roles right now — please check back shortly.';
    console.error(err);
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str) { return escapeHtml(str); }

loadJobs();
</script>

</body>
</html>
