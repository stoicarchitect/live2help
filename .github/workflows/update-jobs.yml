name: Sync live roles from Workable

on:
  schedule:
    # Runs every hour, on the hour (UTC)
    - cron: "0 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest jobs from Workable
        run: node scripts/fetch-jobs.mjs

      - name: Commit and push if jobs.json changed
        run: |
          git config user.name "l2h-job-sync-bot"
          git config user.email "actions@github.com"
          if git diff --quiet jobs.json; then
            echo "No changes to jobs.json - nothing to commit."
          else
            git add jobs.json
            git commit -m "Auto-update live roles from Workable"
            git push
          fi
