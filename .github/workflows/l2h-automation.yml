name: L2H Automation

on:
  schedule:
    - cron: '0 6 * * *'      # every day at 06:00 UTC (07:00 UK summer time, 06:00 winter)
    - cron: '30 6 * * 1'     # Mondays at 06:30 UTC for the weekly digest email
  workflow_dispatch:         # lets you press Run workflow in the Actions tab to test

env:
  API: https://l2h-api.onrender.com
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  daily:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Daily job (health check, backup, tasks, invoice chasing)
        run: |
          curl -sS -G --fail-with-body --retry 4 --retry-delay 30 --retry-connrefused --max-time 120 \
            --data-urlencode "key=$CRON_SECRET" "$API/api/cron/daily"
      - name: Invoice reminder (candidates starting tomorrow)
        if: always()
        run: |
          curl -sS -G --fail-with-body --retry 4 --retry-delay 30 --retry-connrefused --max-time 120 \
            --data-urlencode "key=$CRON_SECRET" "$API/api/check-invoice-reminders"

  weekly-digest:
    if: github.event.schedule == '30 6 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Monday digest email
        run: |
          curl -sS -G --fail-with-body --retry 4 --retry-delay 30 --retry-connrefused --max-time 120 \
            --data-urlencode "key=$CRON_SECRET" "$API/api/cron/weekly-digest"
