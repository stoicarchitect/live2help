name: L2H automation

# Back-up trigger only. The main trigger is cron-job.org calling /api/cron/morning at 5:45am UK,
# because GitHub's scheduler often runs hours late or skips a day. The server only runs the morning
# jobs once per UK day, so if cron-job.org has already run them this does nothing.
on:
  schedule:
    - cron: '50 4 * * *'   # 5:50am UK in summer time (usually runs later than this)
    - cron: '50 5 * * *'   # 5:50am UK in winter
  workflow_dispatch:
    inputs:
      force:
        description: 'Run again even if it already ran today'
        type: boolean
        default: false

env:
  BASE_URL: https://l2h-api.onrender.com
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wake the server
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$BASE_URL/api/health" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "The server did not wake up within about 4 minutes"
          exit 1

      - name: Start the morning jobs
        run: |
          echo "START=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"
          force=""
          if [ "${{ inputs.force }}" = "true" ]; then force="?force=1"; fi
          out=$(curl -sS --fail-with-body --max-time 60 --retry 3 --retry-all-errors --retry-delay 10 \
            -H "x-cron-key: $CRON_SECRET" "$BASE_URL/api/cron/morning$force")
          echo "$out"
          if echo "$out" | jq -e '.alreadyRanToday' > /dev/null; then echo "SKIP=1" >> "$GITHUB_ENV"; fi

      - name: Check the result
        if: env.SKIP != '1'
        run: |
          for i in $(seq 1 180); do
            out=$(curl -sS --max-time 30 --retry 3 --retry-all-errors --retry-delay 5 \
              -H "x-cron-key: $CRON_SECRET" "$BASE_URL/api/cron/status")
            fin=$(echo "$out" | jq -r '.morning.finishedAt // ""')
            if [ -n "$fin" ] && [[ "$fin" > "$START" ]]; then
              echo "$out" | jq '.morning'
              ok=$(echo "$out" | jq -r '.morning.ok')
              if [ "$ok" = "true" ]; then exit 0; fi
              echo "A morning step reported a problem. See the details above."
              exit 1
            fi
            echo "Waiting for the morning jobs to finish ($i)"
            sleep 10
          done
          echo "The morning jobs did not report a result within 30 minutes"
          exit 1
