<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Live 2 Help Talent Partnership</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1226;color:#F7F6F3;font-family:'Gill Sans MT','Gill Sans',Calibri,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
  .card{max-width:420px}
  .brand{color:#C9A84C;letter-spacing:.18em;font-weight:bold;font-size:14px;border-bottom:2px solid #C9A84C;padding-bottom:12px;margin-bottom:20px}
  p{line-height:1.55;color:#D9D7D0}
  a{color:#C9A84C}
</style>
</head>
<body>
<div class="card">
  <div class="brand">LIVE 2 HELP RECRUITMENT</div>
  <p>Opening your Talent Partnership savings calculator...</p>
  <p>If it does not open, <a id="go" href="https://live2helprecruitment.co.uk/savings-k7m2x9/">click here</a>.</p>
</div>
<script>
(function(){
  var fallback = 'https://live2helprecruitment.co.uk/savings-k7m2x9/', done = false;
  function go(u){ if(done) return; done = true; location.replace(u || fallback); }
  var t = (new URLSearchParams(location.search).get('t') || '').replace(/[^A-Za-z0-9_-]/g, '');
  if(!t){ go(); return; }
  setTimeout(function(){ go(); }, 3000);
  fetch('https://l2h-api.onrender.com/api/public/track/' + t, {method:'POST', keepalive:true})
    .then(function(r){ return r.json(); }).then(function(j){ go(j && j.to); }).catch(function(){ go(); });
})();
</script>
</body>
</html>
