<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live 2 Help - Pipeline</title>
<style>
  :root{
    --gold:#C9A84C;
    --dark:#1A1A1A;
    --grey:#444444;
    --lightbg:#F7F6F3;
    --border:#DDDDDD;
    --white:#FFFFFF;
    --danger:#B23A3A;
    --success:#3E7A4C;
  }
  :root:not([data-theme="light"]){ }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Gill Sans MT","Gill Sans",Calibri,sans-serif;
    background:var(--lightbg);
    color:var(--grey);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  a{color:inherit;}

  /* ---- Gate ---- */
  #gate{
    position:fixed;inset:0;background:var(--dark);
    display:flex;align-items:center;justify-content:center;
    z-index:999;padding:1.5rem;
  }
  #gate .box{
    background:var(--white);border-radius:2px;padding:2.5rem 2rem;
    width:100%;max-width:360px;text-align:center;
  }
  #gate .gate-logo{
    width:110px;height:auto;margin:0 auto 18px;display:block;
  }
  .brand-logo{
    width:100%;max-width:190px;height:auto;display:block;
  }
  #gate h1{font-size:20px;color:var(--dark);margin-bottom:1.5rem;font-weight:normal;}
  #gate input{
    width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:2px;
    font-size:15px;font-family:inherit;margin-bottom:12px;
  }
  #gate button{
    width:100%;padding:11px;background:var(--dark);color:var(--white);border:none;
    border-radius:2px;font-size:14px;font-family:inherit;cursor:pointer;letter-spacing:0.5px;
  }
  #gate button:hover{background:#000;}
  #gate .err{color:var(--danger);font-size:13px;margin-bottom:10px;min-height:16px;}

  /* ---- App shell ---- */
  #app{display:none;min-height:100%;}
  #app.visible{display:flex;}

  #sidebar{
    width:260px;flex-shrink:0;background:var(--dark);color:#cfcfcf;
    display:flex;flex-direction:column;
  }
  #sidebar .brand{
    padding:22px 18px 16px;border-bottom:1px solid #333;
  }
  #sidebar .brand .name{color:var(--white);font-size:16px;letter-spacing:0.5px;}
  #sidebar .brand .sub{color:var(--gold);font-size:10px;letter-spacing:2px;margin-top:4px;}
  #companyList{flex:1;overflow-y:auto;padding:10px;}
  .company-block{margin-bottom:6px;}
  .company-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 10px;cursor:pointer;border-radius:2px;font-size:13.5px;color:#e6e6e6;
  }
  .company-head:hover{background:#262626;}
  .company-head .chev{font-size:10px;color:#888;transition:transform .15s;}
  .company-block.open .chev{transform:rotate(90deg);}
  .role-list{display:none;padding-left:14px;}
  .company-block.open .role-list{display:block;}
  .role-item{
    padding:8px 10px;font-size:12.5px;color:#aaa;cursor:pointer;border-radius:2px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .role-item:hover{background:#262626;color:#fff;}
  .role-item.active{background:#2c2410;color:var(--gold);}
  .role-count{
    font-size:10px;background:#333;color:#bbb;padding:1px 6px;border-radius:8px;
  }
  .role-item.active .role-count{background:var(--gold);color:var(--dark);}
  #addRoleBtn{
    margin:12px;padding:10px;border:1px dashed #444;color:#999;background:none;
    font-size:12.5px;font-family:inherit;border-radius:2px;cursor:pointer;text-align:center;
  }
  #addRoleBtn:hover{border-color:var(--gold);color:var(--gold);}

  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{
    background:var(--white);border-bottom:1px solid var(--border);
    padding:16px 24px 14px;display:flex;justify-content:space-between;align-items:center;gap:16px;
    flex-wrap:wrap;position:relative;
  }
  #topbar::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;
    background:linear-gradient(90deg, var(--gold) 0%, #e8d9a8 45%, transparent 100%);
  }
  #topbar .titles{min-width:0;}
  #topbar .company-name{font-size:11px;letter-spacing:1.5px;color:var(--gold);font-weight:bold;}
  #topbar .role-name{font-size:19px;color:var(--dark);margin-top:2px;}
  #topbar .meta{font-size:12px;color:#888;margin-top:3px;}

  .sync-status{
    font-size:11px;color:#999;display:flex;align-items:center;gap:6px;
  }
  .sync-dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;background:#4CAF50;
  }

  #board{
    flex:1;overflow-x:auto;overflow-y:hidden;padding:18px 24px;
    display:flex;gap:14px;align-items:flex-start;
  }
  .stage-col{
    background:var(--white);border:1px solid var(--border);border-radius:2px;
    min-width:230px;max-width:230px;display:flex;flex-direction:column;max-height:100%;
  }
  .stage-head{
    padding:12px 12px 10px;border-bottom:2px solid var(--gold);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .stage-head .t{font-size:12.5px;color:var(--dark);letter-spacing:0.3px;}
  .stage-head .c{font-size:11px;color:#999;}
  .stage-body{padding:10px;overflow-y:auto;flex:1;min-height:60px;}
  .stage-empty{font-size:11.5px;color:#bbb;text-align:center;padding:14px 4px;font-style:italic;}

  .card{
    background:var(--lightbg);border:1px solid var(--border);border-left:3px solid var(--gold);
    border-radius:2px;padding:10px 11px 10px 10px;margin-bottom:9px;cursor:pointer;
    display:flex;gap:9px;align-items:flex-start;transition:transform .1s ease, background .12s ease;
  }
  .card:hover{border-left-color:var(--dark);background:#f0efe9;transform:translateX(1px);}
  .card:active{transform:scale(.99);}
  .card.stage-rejected{border-left-color:var(--danger);}
  .card.stage-success{border-left-color:var(--success);}
  .avatar{
    width:26px;height:26px;border-radius:50%;background:var(--dark);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;flex-shrink:0;
    letter-spacing:0.5px;margin-top:1px;
  }
  .card.stage-rejected .avatar{background:var(--danger);color:#fff;}
  .card.stage-success .avatar{background:var(--success);color:#fff;}
  .card .cbody{min-width:0;flex:1;}
  .card .cname{font-size:13.5px;color:var(--dark);}
  .card .cdays{font-size:11px;color:#999;margin-top:4px;}
  .card .csal{font-size:11px;color:var(--gold);margin-top:3px;}

  /* ---- Modal ---- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;
    align-items:center;justify-content:center;z-index:500;padding:1rem;
  }
  .modal-overlay.visible{display:flex;}
  .modal{
    background:var(--white);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    border-radius:2px;padding:24px;
  }
  .modal-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .modal-head .avatar{width:42px;height:42px;font-size:15px;margin-top:0;}
  .modal h2{font-size:18px;color:var(--dark);font-weight:normal;margin-bottom:2px;}
  .modal .role-sub{font-size:12.5px;color:#999;}
  .contact-row{display:flex;gap:18px;margin-bottom:16px;flex-wrap:wrap;}
  .contact-row a{font-size:12.5px;color:var(--gold);text-decoration:none;}
  .contact-row a:hover{text-decoration:underline;}
  .contact-row span.none{font-size:12.5px;color:#bbb;font-style:italic;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal .field-row{margin-bottom:14px;}
  .modal .field-row label{display:block;font-size:11px;color:#999;letter-spacing:0.5px;margin-bottom:4px;}
  .modal .field-row .val{font-size:13.5px;color:var(--grey);}
  .modal input, .modal textarea{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:2px;
    font-size:13.5px;font-family:inherit;
  }
  .modal textarea{min-height:70px;resize:vertical;}
  .prompt-box{
    background:var(--lightbg);border-left:3px solid var(--gold);padding:12px 14px;
    font-size:13px;color:var(--grey);margin:16px 0;line-height:1.5;
  }
  .prompt-box strong{color:var(--dark);}
  .stage-buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
  .stage-buttons button{
    flex:1;min-width:120px;padding:10px;border:1px solid var(--dark);background:var(--white);
    color:var(--dark);font-family:inherit;font-size:12.5px;border-radius:2px;cursor:pointer;
  }
  .stage-buttons button.primary{background:var(--dark);color:var(--white);}
  .stage-buttons button.reject{border-color:var(--danger);color:var(--danger);}
  .stage-buttons button:hover{opacity:.85;}
  .modal-close{
    position:absolute;top:16px;right:16px;background:none;border:none;font-size:18px;
    color:#999;cursor:pointer;
  }
  .modal-inner{position:relative;}

  /* Add role modal */
  .simple-form label{display:block;font-size:11px;color:#999;margin:12px 0 4px;letter-spacing:0.5px;}
  .simple-form input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:2px;font-family:inherit;font-size:13.5px;}
  .simple-form .actions{margin-top:20px;display:flex;gap:8px;}
  .simple-form .actions button{flex:1;padding:10px;border-radius:2px;font-family:inherit;font-size:13px;cursor:pointer;}
  .simple-form .actions .save{background:var(--dark);color:var(--white);border:1px solid var(--dark);}
  .simple-form .actions .cancel{background:var(--white);color:var(--grey);border:1px solid var(--border);}

  .confirm-modal{
    background:var(--white);width:100%;max-width:380px;border-radius:2px;padding:24px;
  }
  .confirm-modal h2{font-size:17px;color:var(--dark);margin-bottom:12px;}
  .confirm-modal p{font-size:13.5px;color:var(--grey);line-height:1.5;margin-bottom:14px;}
  .confirm-modal .field-row{margin-bottom:14px;}
  .confirm-modal .field-row label{display:block;font-size:11px;color:#999;letter-spacing:0.5px;margin-bottom:4px;}
  .confirm-modal textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:2px;font-size:13.5px;font-family:inherit;min-height:60px;resize:vertical;}
  .confirm-modal .confirm-actions{display:flex;gap:8px;margin-top:18px;}
  .confirm-modal .confirm-actions button{flex:1;padding:10px;border-radius:2px;font-family:inherit;font-size:12.5px;cursor:pointer;border:1px solid;}
  .confirm-modal .confirm-actions .delete-btn{background:var(--danger);color:var(--white);border-color:var(--danger);}
  .confirm-modal .confirm-actions .delete-btn:hover{opacity:.9;}
  .confirm-modal .confirm-actions .cancel-btn{background:var(--white);color:var(--grey);border-color:var(--border);}
  .confirm-modal .confirm-actions .cancel-btn:hover{background:#f9f9f9;}

  .sync-status{
    position:fixed;bottom:20px;right:20px;font-size:11px;color:#999;background:var(--white);
    border:1px solid var(--border);padding:6px 10px;border-radius:2px;z-index:400;
  }

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--dark);color:var(--white);padding:11px 20px;border-radius:2px;
    font-size:13px;z-index:600;display:none;
  }

  /* ---- Mobile ---- */
  #mobileBar{display:none;}
  @media (max-width: 780px){
    #app.visible{flex-direction:column;}
    #sidebar{width:100%;max-height:none;}
    #companyList{max-height:38vh;}
    #board{
      flex-direction:column;overflow-x:visible;padding:12px 14px;gap:0;
    }
    .stage-col{max-width:none;min-width:0;width:100%;margin-bottom:10px;max-height:none;}
    .stage-body{max-height:none;}
    .card{display:flex;justify-content:space-between;align-items:center;gap:10px;}
    .card .cname{font-size:13px;}
    .card .cdays,.card .csal{display:none;}
    .card .mob-action{font-size:11px;color:var(--gold);white-space:nowrap;}
    #topbar{padding:14px 16px;}
  }
</style>
</head>

      <div class="sync-status" id="syncStatus"><span class="sync-dot"></span><span id="syncTime">Last synced: never</span></div>
      <button id="addCandBtn" onclick="openAddCandidate()" style="display:none;padding:10px 16px;background:var(--dark);color:var(--white);border:none;border-radius:2px;font-family:inherit;font-size:12.5px;cursor:pointer;">+ Add candidate</button>
    </div>
    <div id="board"></div>
  </div>
</div>

<div class="modal-overlay" id="candModalOverlay">
  <div class="modal">
    <div class="modal-inner">
      <button class="modal-close" onclick="closeModal('candModalOverlay')">&times;</button>
      <div id="candModalBody"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addRoleOverlay">
  <div class="modal">
    <div class="modal-inner">
      <button class="modal-close" onclick="closeModal('addRoleOverlay')">&times;</button>
      <h2>New company / role</h2>
      <div class="simple-form">
        <label>Company name</label>
        <input id="newCompanyName" placeholder="e.g. Ceasefire Industries">
        <label>Role title</label>
        <input id="newRoleName" placeholder="e.g. Sales Manager - Midlands">
        <div class="actions">
          <button class="cancel" onclick="closeModal('addRoleOverlay')">Cancel</button>
          <button class="save" onclick="saveNewRole()">Create role</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="addCandOverlay">
  <div class="modal">
    <div class="modal-inner">
      <button class="modal-close" onclick="closeModal('addCandOverlay')">&times;</button>
      <h2>New candidate</h2>
      <div class="role-sub" id="addCandRoleSub"></div>
      <div class="simple-form">
        <label>Candidate name</label>
        <input id="newCandName" placeholder="e.g. Priya K">
        <label>Email (optional)</label>
        <input id="newCandEmail" placeholder="candidate@email.com">
        <label>Phone (optional)</label>
        <input id="newCandPhone" placeholder="07000 000000">
        <div class="actions">
          <button class="cancel" onclick="closeModal('addCandOverlay')">Cancel</button>
          <button class="save" onclick="saveNewCandidate()">Add to Submitted</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deleteConfirmOverlay">
  <div class="confirm-modal">
    <h2>Delete from pipeline?</h2>
    <p>This removes the candidate from the pipeline. You cannot undo this action.</p>
    <div class="field-row">
      <label>Reason for removal (optional)</label>
      <textarea id="deleteReasonInput" placeholder="e.g. Candidate withdrew, no longer pursuing, etc."></textarea>
    </div>
    <div class="confirm-actions">
      <button class="cancel-btn" onclick="closeModal('deleteConfirmOverlay')">Cancel</button>
      <button class="delete-btn" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STAGES = [
  {key:"submitted", label:"Submitted"},
  {key:"interview_requested", label:"Interview Requested"},
  {key:"interview_scheduled", label:"Interview Scheduled"},
  {key:"interviewed", label:"Interviewed"},
  {key:"offer", label:"Offer"},
  {key:"rejected", label:"Rejected"},
  {key:"start_date", label:"Start Date"},
  {key:"day1", label:"Day 1 Sent"},
  {key:"week1", label:"Week 1 Check-in"},
  {key:"month1", label:"Month 1 Check-in"},
];

const PROMPTS = {
  submitted: "Candidate submitted to client. Awaiting response - if no reply by 4pm the day after submission, call the client and send a follow-up email.",
  interview_requested: "Call candidate for availability.",
  interview_scheduled: "Confirm interview date and time with the client. Send Interview Confirmation email pack and site onboarding pack. Send calendar invite to client and candidate.",
  interviewed: null,
  offer: "Confirm terms with the client. Call candidate with the offer. Send Offer Letter. Enter the agreed salary below - it is needed for the invoice reminder.",
  rejected: "Send Candidate Rejection Email. Document the rejection reason.",
  start_date: "Follow the final pre-start steps: Information Request Email, Client Handover Pack, Pre-Start Onboarding Pack. An invoice reminder email will go to Dan one day before this candidate's start date.",
  day1: "Send Day 1 welcome message to the candidate.",
  week1: "Complete the Week 1 check-in call with the candidate.",
  month1: "Complete the Month 1 check-in call with the candidate.",
};

const API_BASE = "https://l2h-api.onrender.com";
let DATA = {};
let dataLoaded = false;

async function loadCandidates(){
  const board = document.getElementById('board');
  try{
    const res = await fetch(`${API_BASE}/api/candidates`);
    if(!res.ok) throw new Error('Server returned ' + res.status);
    const json = await res.json();
    DATA = json.data || {};
    dataLoaded = true;
    renderSidebar();
    renderBoard();
  }catch(e){
    dataLoaded = false;
    board.innerHTML = `<div class="stage-empty" style="padding-top:40px;max-width:420px;">
      Could not load live pipeline data (${e.message}). The dashboard backend may not be configured yet - check the Sheet tab, sharing, and Render environment variables.
    </div>`;
    showToast('Could not reach the pipeline backend');
  }
}

async function saveCandidate(c){
  try{
    const res = await fetch(`${API_BASE}/api/candidates`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(c)
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      throw new Error(err.error || ('Server returned ' + res.status));
    }
  }catch(e){
    showToast('Could not save to backend: ' + e.message);
  }
}

let currentCompany = null;
let currentRole = null;
let openCandidateId = null;

function daysSince(dateStr){
  const d = new Date(dateStr);
  const diff = Math.round((Date.now() - d.getTime()) / 86400000);
  return diff;
}

function initials(name){
  return name.split(' ').filter(Boolean).map(p => p[0]).join('').slice(0,2).toUpperCase();
}

function tryUnlock(){
  const pw = document.getElementById('gatePw').value;
  if(pw === "l2h2026"){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    try{ localStorage.setItem('l2h_unlocked','1'); }catch(e){}
    renderSidebar();
    loadCandidates();
  } else {
    document.getElementById('gateErr').textContent = "Incorrect password";
  }
}
document.getElementById('gatePw').addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });

(function checkSession(){
  try{
    if(localStorage.getItem('l2h_unlocked') === '1'){
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      renderSidebar();
      loadCandidates();
    }
  }catch(e){}
})();

function renderSidebar(){
  const list = document.getElementById('companyList');
  list.innerHTML = '';
  Object.keys(DATA).forEach(company => {
    const block = document.createElement('div');
    block.className = 'company-block' + (company === currentCompany ? ' open' : '');
    const head = document.createElement('div');
    head.className = 'company-head';
    head.innerHTML = `<span>${company}</span><span class="chev">&#9656;</span>`;
    head.onclick = () => { block.classList.toggle('open'); };
    block.appendChild(head);

    const roleList = document.createElement('div');
    roleList.className = 'role-list';
    Object.keys(DATA[company]).forEach(role => {
      const count = DATA[company][role].filter(c => c.stage !== 'rejected').length;
      const item = document.createElement('div');
      item.className = 'role-item' + (company === currentCompany && role === currentRole ? ' active' : '');
      item.innerHTML = `<span>${role}</span><span class="role-count">${count}</span>`;
      item.onclick = () => selectRole(company, role);
      roleList.appendChild(item);
    });
    block.appendChild(roleList);
    list.appendChild(block);
  });
}

function selectRole(company, role){
  currentCompany = company;
  currentRole = role;
  renderSidebar();
  renderBoard();
}

function renderBoard(){
  const board = document.getElementById('board');
  const tbCompany = document.getElementById('tbCompany');
  const tbRole = document.getElementById('tbRole');
  const tbMeta = document.getElementById('tbMeta');
  const addBtn = document.getElementById('addCandBtn');

  if(!currentRole){
    board.innerHTML = '<div class="stage-empty" style="padding-top:40px;">Select a company and role from the left to view its pipeline.</div>';
    tbCompany.textContent = '-';
    tbRole.textContent = 'Select a role';
    tbMeta.textContent = '';
    addBtn.style.display = 'none';
    return;
  }
  addBtn.style.display = 'inline-block';

  const candidates = DATA[currentCompany][currentRole];
  tbCompany.textContent = currentCompany.toUpperCase();
  tbRole.textContent = currentRole;
  tbMeta.textContent = candidates.length + (candidates.length === 1 ? ' candidate in pipeline' : ' candidates in pipeline');

  board.innerHTML = '';
  STAGES.forEach(stage => {
    const col = document.createElement('div');
    col.className = 'stage-col';
    const inStage = candidates.filter(c => c.stage === stage.key);
    col.innerHTML = `<div class="stage-head"><span class="t">${stage.label}</span><span class="c">${inStage.length}</span></div>`;
    const body = document.createElement('div');
    body.className = 'stage-body';
    if(inStage.length === 0){
      body.innerHTML = '<div class="stage-empty">No candidates</div>';
    } else {
      inStage.forEach(c => {
        const card = document.createElement('div');
        const successStages = ['start_date','day1','week1','month1'];
        let typeClass = '';
        if(c.stage === 'rejected') typeClass = 'stage-rejected';
        else if(successStages.includes(c.stage)) typeClass = 'stage-success';
        card.className = 'card ' + typeClass;
        card.onclick = () => openCandidateModal(c.id);
        const d = daysSince(c.date);
        card.innerHTML = `
          <div class="avatar">${initials(c.name)}</div>
          <div class="cbody">
            <div class="cname">${c.name}</div>
            <div class="cdays">${d} day${d===1?'':'s'} in stage</div>
            ${c.salary ? `<div class="csal">£${c.salary}</div>` : ''}
            <div class="mob-action">View &rsaquo;</div>
          </div>
        `;
        body.appendChild(card);
      });
    }
    col.appendChild(body);
    board.appendChild(col);
  });
}

function findCandidate(id){
  return DATA[currentCompany][currentRole].find(c => c.id === id);
}

function openCandidateModal(id){
  openCandidateId = id;
  const c = findCandidate(id);
  const stageObj = STAGES.find(s => s.key === c.stage);
  const prompt = PROMPTS[c.stage];

  let html = `
    <div class="modal-head">
      <div class="avatar">${initials(c.name)}</div>
      <div>
        <h2>${c.name}</h2>
        <div class="role-sub">${currentRole} &middot; ${currentCompany}</div>
      </div>
    </div>
    <div class="contact-row">
      ${c.email ? `<a href="mailto:${c.email}"><i>&#9993;</i> ${c.email}</a>` : '<span class="none">No email on file</span>'}
      ${c.phone ? `<a href="tel:${c.phone}"><i>&#9742;</i> ${c.phone}</a>` : '<span class="none">No number on file</span>'}
    </div>
    <div class="field-row"><label>Current stage</label><div class="val">${stageObj.label}</div></div>
    <div class="field-row"><label>Days in stage</label><div class="val">${daysSince(c.date)}</div></div>
  `;

  if(prompt){
    html += `<div class="prompt-box"><strong>Next step:</strong> ${prompt}</div>`;
  }

  html += `
    <div class="two-col">
      <div class="field-row">
        <label>Email</label>
        <input type="email" id="emailInput" value="${c.email || ''}" placeholder="candidate@email.com">
      </div>
      <div class="field-row">
        <label>Phone</label>
        <input type="tel" id="phoneInput" value="${c.phone || ''}" placeholder="07000 000000">
      </div>
    </div>
  `;

  if(c.stage === 'offer'){
    html += `
      <div class="field-row">
        <label>Agreed salary (£)</label>
        <input type="text" id="salaryInput" value="${c.salary || ''}" placeholder="e.g. 42000">
      </div>`;
  }

  html += `
    <div class="field-row">
      <label>Notes</label>
      <textarea id="notesInput" placeholder="Add notes for this candidate">${c.notes || ''}</textarea>
    </div>
  `;

  html += buildStageButtons(c);

  document.getElementById('candModalBody').innerHTML = html;
  document.getElementById('candModalOverlay').classList.add('visible');
}

function buildStageButtons(c){
  const order = STAGES.map(s => s.key).filter(k => k !== 'rejected');
  const idx = order.indexOf(c.stage);
  const nextKey = idx >= 0 && idx < order.length - 1 ? order[idx+1] : null;
  const stageObj = STAGES.find(s => s.key === nextKey);

  let html = '<div class="stage-buttons">';
  if(nextKey){
    html += `<button class="primary" onclick="advanceStage('${nextKey}')">Move to ${stageObj.label}</button>`;
  }
  if(c.stage !== 'rejected' && c.stage !== 'month1'){
    html += `<button class="reject" onclick="advanceStage('rejected')">Reject candidate</button>`;
  }
  html += `<button onclick="saveNotesOnly()">Save notes</button>`;
  html += `<button class="reject" onclick="openDeleteConfirm()" style="margin-top:8px;width:100%;">Delete from pipeline</button>`;
  html += '</div>';
  return html;
}

function captureFieldsFromModal(c){
  const notesEl = document.getElementById('notesInput');
  if(notesEl) c.notes = notesEl.value;
  const salEl = document.getElementById('salaryInput');
  if(salEl) c.salary = salEl.value;
  const emailEl = document.getElementById('emailInput');
  if(emailEl) c.email = emailEl.value;
  const phoneEl = document.getElementById('phoneInput');
  if(phoneEl) c.phone = phoneEl.value;
}

async function saveNotesOnly(){
  const c = findCandidate(openCandidateId);
  captureFieldsFromModal(c);
  showToast('Saved');
  renderBoard();
  closeModal('candModalOverlay');
  await saveCandidate(c);

  if(newStage === 'offer'){
    openCandidateModal(c.id);
    showToast('Enter the agreed salary - needed for the invoice reminder');
  }
}

async function advanceStage(newStage){
  const c = findCandidate(openCandidateId);
  captureFieldsFromModal(c);

  c.stage = newStage;
  c.date = new Date().toISOString().slice(0,10);

  if(newStage === 'start_date'){
    showToast('Moved to Start Date - an invoice reminder will be emailed to Dan one day before the start date');
  } else {
    showToast('Moved to ' + STAGES.find(s=>s.key===newStage).label);
  }

  renderBoard();
  closeModal('candModalOverlay');
  await saveCandidate(c);

  if(newStage === 'offer'){
    openCandidateModal(c.id);
    showToast('Enter the agreed salary - needed for the invoice reminder');
  }
}

function openAddRole(){
  document.getElementById('newCompanyName').value = '';
  document.getElementById('newRoleName').value = '';
  document.getElementById('addRoleOverlay').classList.add('visible');
}

function saveNewRole(){
  const company = document.getElementById('newCompanyName').value.trim();
  const role = document.getElementById('newRoleName').value.trim();
  if(!company || !role){
    showToast('Enter both a company and a role name');
    return;
  }
  if(!DATA[company]) DATA[company] = {};
  if(!DATA[company][role]) DATA[company][role] = [];
  closeModal('addRoleOverlay');
  renderSidebar();
  selectRole(company, role);
  showToast('Role created - add a candidate to save it to the sheet');
}

function openAddCandidate(){
  if(!currentRole) return;
  document.getElementById('newCandName').value = '';
  document.getElementById('newCandEmail').value = '';
  document.getElementById('newCandPhone').value = '';
  document.getElementById('addCandRoleSub').textContent = currentRole + ' - ' + currentCompany;
  document.getElementById('addCandOverlay').classList.add('visible');
}

async function saveNewCandidate(){
  const name = document.getElementById('newCandName').value.trim();
  if(!name){
    showToast('Enter a candidate name');
    return;
  }
  const c = {
    id: 'c_' + Date.now(),
    company: currentCompany,
    role: currentRole,
    name: name,
    stage: 'submitted',
    date: new Date().toISOString().slice(0,10),
    notes: '',
    salary: '',
    email: document.getElementById('newCandEmail').value.trim(),
    phone: document.getElementById('newCandPhone').value.trim(),
  };
  if(!DATA[currentCompany]) DATA[currentCompany] = {};
  if(!DATA[currentCompany][currentRole]) DATA[currentCompany][currentRole] = [];
  DATA[currentCompany][currentRole].push(c);
  closeModal('addCandOverlay');
  renderBoard();
  showToast('Candidate added');
  await saveCandidate(c);
}

function closeModal(id){
  document.getElementById(id).classList.remove('visible');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3200);
}

function openDeleteConfirm(){
  document.getElementById('deleteReasonInput').value = '';
  document.getElementById('deleteConfirmOverlay').classList.add('visible');
}

async function confirmDelete(){
  const c = findCandidate(openCandidateId);
  const reason = document.getElementById('deleteReasonInput').value.trim();
  
  try{
    const res = await fetch(`${API_BASE}/api/candidates/${c.id}`, {
      method: 'DELETE',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({reason: reason || 'Deleted from pipeline'})
    });
    
    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      throw new Error(err.error || ('Server returned ' + res.status));
    }
    
    DATA[currentCompany][currentRole] = DATA[currentCompany][currentRole].filter(x => x.id !== c.id);
    closeModal('deleteConfirmOverlay');
    closeModal('candModalOverlay');
    renderBoard();
    showToast('Candidate removed from pipeline');
  }catch(e){
    showToast('Could not delete: ' + e.message);
  }
}

async function syncSubmissions(){
  try{
    const res = await fetch(`${API_BASE}/api/sync-submissions`, {method: 'POST'});
    if(res.ok){
      await new Promise(r => setTimeout(r, 500));
      await loadCandidates();
      updateSyncTime();
    }
  }catch(e){
    console.log('Auto-sync failed:', e.message);
  }
}

function updateSyncTime(){
  window._lastSyncTime = Date.now();
  const el = document.getElementById('syncTime');
  if(el) el.textContent = 'Last synced: just now';
}

function formatSyncTime(){
  if(!window._lastSyncTime) return 'Last synced: never';
  const diff = Date.now() - window._lastSyncTime;
  const mins = Math.floor(diff / 60000);
  if(mins === 0) return 'Last synced: just now';
  if(mins === 1) return 'Last synced: 1 minute ago';
  if(mins < 60) return `Last synced: ${mins} minutes ago`;
  const hours = Math.floor(mins / 60);
  if(hours === 1) return 'Last synced: 1 hour ago';
  return `Last synced: ${hours} hours ago`;
}

function updateSyncDisplay(){
  const el = document.getElementById('syncTime');
  if(el && window._lastSyncTime) el.textContent = formatSyncTime();
}

window._autoSyncInterval = null;
function startAutoSync(){
  if(window._autoSyncInterval) return;
  syncSubmissions();
  window._autoSyncInterval = setInterval(syncSubmissions, 5 * 60 * 1000);
  setInterval(updateSyncDisplay, 1000);
}

document.querySelectorAll('.modal-overlay').forEach(ov => {
  ov.addEventListener('click', e => { if(e.target === ov) ov.classList.remove('visible'); });
});

startAutoSync();
</script>

</body>
</html>
